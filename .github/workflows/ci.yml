name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest + coverage (unit)
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing --cov-fail-under=80

      - name: Pytest (integration, real dependencies)
        # Integration tests exercise real external deps and are added as those
        # seams gain real backends. Exit code 5 == "no tests collected" is the
        # only tolerated non-zero code; every real failure still fails the job.
        run: |
          set +e
          uv run pytest -m integration
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No integration tests collected yet — skipping."
            exit 0
          fi
          exit "$code"

  reproduce:
    # Constitution P16: the full evaluation must run from one documented command
    # on a **clean machine**. This job *is* that clean machine — a fresh runner
    # with only git + uv, running the same script a third party would run, and
    # requiring byte-identical artifacts against the committed baseline.
    name: reproduce (clean machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: One-command reproduction
        run: ./scripts/reproduce.sh

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-run
          # The private split stays out: it is PO-custodied (P11) and must not
          # leave the machine, not even as a CI artifact.
          path: |
            runs/sample
            !runs/sample/dataset/andbench-private.jsonl
          # warn, not error: a failed reproduction already fails the job above —
          # a second red step would only obscure the real cause.
          if-no-files-found: warn
          retention-days: 7

  decontam-embedding:
    # Constitution P10 requires TWO checks between every item and Maia's training
    # set: n-gram overlap and embedding similarity. The n-gram half runs in the
    # gate above with no extra dependency; this job installs the optional
    # `decontam` group and exercises the paraphrase half, plus the calibration that
    # justifies its threshold. Kept separate so the fast gate stays fast and the
    # clean-machine reproduction stays hermetic.
    name: decontamination (embedding half)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies (with the embedding extra)
        run: uv sync --frozen --group dev --group decontam

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('configs/decontam_pairs.yaml') }}-paraphrase-multilingual-MiniLM-L12-v2
          restore-keys: hf-

      - name: Threshold still separates the labelled pairs
        # Exits non-zero if no cut-off separates paraphrases from hard negatives, so
        # an embedder or pair-set change cannot silently invalidate the threshold.
        run: uv run andbench decontam-threshold --out threshold-sweep.json

      - name: Embedding decontamination pass over the sample items
        run: |
          uv run andbench decontam-pass data/sample/items.jsonl \
            --train data/sample/maia-train.txt \
            --out decontam-embedding \
            --embedding

      - name: Upload the sweep and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decontamination-embedding
          path: |
            threshold-sweep.json
            decontam-embedding
          if-no-files-found: warn
          retention-days: 7
