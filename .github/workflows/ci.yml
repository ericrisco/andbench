name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest + coverage (unit)
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing --cov-fail-under=80

      - name: Pytest (integration, real dependencies)
        # Integration tests exercise real external deps and are added as those
        # seams gain real backends. Exit code 5 == "no tests collected" is the
        # only tolerated non-zero code; every real failure still fails the job.
        run: |
          set +e
          uv run pytest -m integration
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No integration tests collected yet — skipping."
            exit 0
          fi
          exit "$code"
